# rsconstruct configuration for this repository — shared defaults plus
# repo-specific config (merged from the former rsconstruct.local.toml).

# ─── analyzers ───────────────────────────────────────────────────────────────

[analyzer.tera]

[analyzer.python]

# ─── templating ──────────────────────────────────────────────────────────────

# Convention: tera configs are Lua (config/*.lua). dep_auto entries are
# silently skipped where absent. Repos still on config/*.py keep a
# dep_inputs override in their local overlay until converted.
[processor.tera]
dep_auto = [
	"config/project.lua",
	"config/personal.lua",
	"config/version.lua",
	"config/github.lua",
	"config/python.lua",
	"config/shared.lua",
]
src_dirs = ["tera.templates"]

[processor.ruff]
src_dirs = ["src", "scripts", "config"]

[processor.pylint]
src_dirs = ["src", "scripts", "config"]

[processor.mypy]
src_dirs = ["src", "scripts", "config"]

[processor.requirements]
src_dirs = ["src", "scripts", "config"]

# ─── shell ───────────────────────────────────────────────────────────────────

[processor.shellcheck]
src_dirs = ["scripts", "src", "misc", "config"]
args = ["--severity=error", "--shell=bash"]

# ─── lua ─────────────────────────────────────────────────────────────────────

[processor.luacheck]
src_dirs = ["config"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.taplo]
src_dirs = ["."]

# The Makefile's default build zipped three WordPress bundles: the myworld and
# myheb plugins into out/plugins/, and the mytheme theme into out/themes/.
# scripts/build_bundles.py runs the same `zip -r` per directory; the explicit
# processor keys on the source files and declares the three zips as outputs.
# (JSCHECK was DO_JSCHECK:=0 in the Makefile, so the jshint step was off.)
[processor.explicit.bundles]
command = "scripts/build_bundles.py"
input_globs = ["myworld/**/*", "myheb/**/*", "mytheme/**/*"]
output_files = [
    "out/plugins/myworld.zip",
    "out/plugins/myheb.zip",
    "out/themes/mytheme.zip",
]
