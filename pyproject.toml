# Generated so `uv sync` installs this repo's Python dependencies.
# Derived from the third-party imports found in the repo's .py files.

[project]
name = "myworld-php"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "cinemagoer",
    "mysql-connector-python",
    "mysqlclient",
]

[tool.uv]
# Demo/teaching/archive repo: not an installable package.
package = false

[tool.mypy]
mypy_path = "src:python:scripts"
explicit_package_bases = true
namespace_packages = true

# Third-party libraries without type stubs; `foo.*` also matches `foo` itself.
[[tool.mypy.overrides]]
module = [
    "download.*",
    "imdb.*",
    "MediaInfoDLL3.*",
    "MySQLdb.*",
]
ignore_missing_imports = true
