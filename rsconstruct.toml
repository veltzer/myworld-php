# rsconstruct build configuration for this repository.

[build]
# src_dirs entries name directories; "." (the whole tree) is a config error
reject_dot_src_dirs = true

# ─── analyzers ───────────────────────────────────────────────────────────────

[analyzer.tera]

[analyzer.python]

# ─── templating ──────────────────────────────────────────────────────────────

# Convention: tera configs are Lua (config/*.lua). Every dep_auto entry
# listed here must exist: rsconstruct rejects a missing one at config load.
# Repos still on config/*.py keep a dep_inputs override in their local
# overlay until converted.
[processor.generator.tera]
dep_auto = [
	"config/project.lua",
	"config/personal.lua",
	"config/version.lua",
]
src_dirs = ["tera.templates"]

[processor.checker.ruff]
src_dirs = ["src", "scripts", "config"]


[processor.checker.mypy]
src_dirs = ["src", "scripts", "config"]

# ─── shell ───────────────────────────────────────────────────────────────────

[processor.checker.shellcheck]
src_dirs = ["scripts", "src", "misc", "config"]

# ─── lua ─────────────────────────────────────────────────────────────────────

[processor.checker.luacheck]
src_dirs = ["config"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.checker.taplo]
src_files = [".rumdl.toml", "pyproject.toml", "rsconstruct.toml"]

# The Makefile's default build zipped three WordPress bundles: the myworld and
# myheb plugins into out/plugins/, and the mytheme theme into out/themes/.
# scripts/build_bundles.py runs the same `zip -r` per directory; the explicit
# processor keys on the source files and declares the three zips as outputs.
# (JSCHECK was DO_JSCHECK:=0 in the Makefile, so the jshint step was off.)
[processor.explicit.generic.bundles]
command = "scripts/build_bundles.py"
input_globs = ["myworld/**/*", "myheb/**/*", "mytheme/**/*"]
output_files = [
    "out/plugins/myworld.zip",
    "out/plugins/myheb.zip",
    "out/themes/mytheme.zip",
]

# lint the GitHub Actions workflow files with actionlint
[processor.checker.actionlint]
src_dirs = [".github/workflows"]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.checker.rumdl]
src_files = ["README.md"]

# ─── json ────────────────────────────────────────────────────────────────────

[processor.checker.ijsonlint]
src_dirs = ["private"]

# ─── php ─────────────────────────────────────────────────────────────────────

[processor.checker.php_lint]
src_dirs = ["myheb", "mytheme", "myworld", "private"]

# ─── perl ────────────────────────────────────────────────────────────────────

[processor.checker.perlcritic]
src_dirs = ["perl", "src"]

# ─── html ────────────────────────────────────────────────────────────────────

[processor.checker.tidy]
src_dirs = ["private"]

# ─── css ─────────────────────────────────────────────────────────────────────

# Only .css is passed: biome.jsonc turns biome's JavaScript and JSON linters
# off, oxlint covers JavaScript and ijsonlint covers JSON.
[processor.checker.biome]
src_dirs = ["myheb/css", "mytheme", "myworld/css", "private"]
src_extensions = [".css"]

# ─── javascript ──────────────────────────────────────────────────────────────

[processor.checker.oxlint]
src_dirs = ["public"]
args = ["-c", ".oxlintrc.json"]
