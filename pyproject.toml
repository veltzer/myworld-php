# Generated so `uv sync` installs this repo's Python dependencies.
# Derived from the third-party imports found in the repo's .py files.

[project]
name = "myworld-php"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "cinemagoer",
    "mysql-connector-python",
    "mysqlclient",
]

[dependency-groups]
dev = [
    "pyrefly",
    "pytest",
    "ruff",
    "types-mysqlclient",
]

[tool.uv]
# Demo/teaching/archive repo: not an installable package.
package = false

[tool.pyrefly]
# Type checking (rsconstruct's pyrefly processor), with pyrefly's default
# error set. "." on the search path is mypy's implicit current directory.
# Warnings fail the check like errors (pyrefly lets them pass by default).
min-severity = "warn"
search-path = [
    "src",
    "python",
    "scripts",
    ".",
]
# Third-party libraries without type information.
ignore-missing-imports = [
    "download.*",
    "MediaInfoDLL3.*",
]

[tool.pyrefly.errors]
no-any-return = "error"
